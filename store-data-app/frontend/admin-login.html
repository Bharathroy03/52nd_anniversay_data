<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Store Data Collection System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Custom vertical alignment for login */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-wrapper {
      width: 100%;
      max-width: 440px;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <!-- Accent Color Band -->
    <div class="form-header-card"></div>
    
    <div class="card" style="margin-bottom: 0;">
      <div class="login-logo">Admin Panel</div>
      <p class="form-description" style="text-align: center; margin-bottom: 30px;">
        Authenticate with admin credentials to manage store submissions.
      </p>
      
      <!-- General Login Error Notification -->
      <div class="form-group" id="login-error-container" style="display: none; margin-bottom: 20px;">
        <div class="badge badge-issue-yes" style="display: flex; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.88rem; width: 100%; text-transform: none; text-align: center; justify-content: center;">
          Invalid username or password. Please try again.
        </div>
      </div>
      
      <!-- Login Form -->
      <form id="loginForm" novalidate>
        
        <!-- Username input -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label class="form-label" for="username">Username</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
          <div class="error-msg" id="username-error">Username is required.</div>
        </div>
        
        <!-- Password input -->
        <div class="form-group" style="margin-bottom: 30px;">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
          <div class="error-msg" id="password-error">Password is required.</div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login to Dashboard</button>
        
        <div style="text-align: center; margin-top: 20px;">
          <a href="/" style="font-size: 0.9rem; color: var(--primary); text-decoration: none; font-weight: 500;">← Back to Public Form</a>
        </div>
      </form>
      
    </div>
  </div>

  <!-- Admin logic file -->
  <script src="js/admin.js"></script>
</body>
</html>
